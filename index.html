<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Default title (overridden by react-helmet-async per page) -->
    <title>MisterVet | Medicina Veterinaria Integral</title>
    <meta name="author" content="MisterVet" />
    <meta name="theme-color" content="#163E8D" />

    <!-- Open Graph base (page-specific tags added by Helmet) -->
    <meta property="og:site_name" content="MisterVet" />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:image" content="https://www.mistervet.co/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="MisterVet - Medicina Veterinaria Integral" />

    <!-- Twitter base -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://www.mistervet.co/og-image.png" />

    <!-- Performance: preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

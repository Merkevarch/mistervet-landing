<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Estáticos base (cada página los sobreescribe vía react-helmet-async) -->
    <title>MisterVet | Medicina Veterinaria Integral para Mascotas y Producción Animal</title>
    <meta name="description" content="MisterVet — Medicina veterinaria integral para mascotas y producción animal en Colombia. Servicio a domicilio, consultas, cirugías, laboratorio y consultoría pecuaria." />
    <meta name="author" content="MisterVet" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="theme-color" content="#163E8D" />
    <link rel="canonical" href="https://www.mistervet.co/" />

    <!-- Open Graph base -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MisterVet" />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:image" content="https://www.mistervet.co/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="MisterVet - Medicina Veterinaria Integral" />

    <!-- Twitter base -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://www.mistervet.co/og-image.png" />

    <!-- Performance: preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

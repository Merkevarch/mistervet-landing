name = "mistervet-cms-oauth"
main = "src/index.js"
compatibility_date = "2024-09-23"
workers_dev = true

# Variables de entorno NO secretas (pueden ir aquí si son públicas).
# Los secrets (GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET) NO se ponen aquí:
# se configuran con `wrangler secret put`.

# Opcional: si quieres permitir orígenes adicionales para postMessage
# (por ejemplo, previews de Cloudflare Pages), añádelos aquí como array:
# [vars]
# CMS_ORIGIN = "https://abc123.mistervet-landing.pages.dev"

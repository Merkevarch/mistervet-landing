<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Admin · MisterVet Blog</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#163E8D" />
    <style>
      /* Loader mientras carga Decap CMS */
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f8fafc; margin: 0; }
      .cms-loader {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 16px; color: #475569;
      }
      .cms-loader svg { width: 48px; height: 48px; animation: spin 1s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="cms-loader" id="loader">
      <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="24" cy="24" r="20" stroke="#2E86DE" stroke-opacity="0.2" stroke-width="4"/>
        <path d="M24 4 a20 20 0 0 1 20 20" stroke="#2E86DE" stroke-width="4" stroke-linecap="round"/>
      </svg>
      <p>Cargando panel de administración…</p>
    </div>

    <!-- Decap CMS -->
    <script src="https://unpkg.com/decap-cms@3.6.4/dist/decap-cms.js"></script>
    <script>
      // Ocultar el loader una vez que Decap CMS terminó de cargar
      window.addEventListener('load', () => {
        setTimeout(() => {
          const loader = document.getElementById('loader');
          if (loader) loader.style.display = 'none';
        }, 1500);
      });
    </script>
  </body>
</html>

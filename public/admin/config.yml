# ============================================================
# Decap CMS Configuration — Flujo PKCE (moderno, sin Worker)
# ============================================================
# Autenticación directa con GitHub usando el flujo OAuth PKCE
# (Proof Key for Code Exchange). Es el estándar moderno y no requiere
# el Cloudflare Worker OAuth proxy.
#
# RAZÓN DE LA MIGRACIÓN (desde flujo `implicit`):
# Decap CMS con auth_type: implicit tiene un bug conocido donde ignora
# `auth_endpoint` y cae al fallback de Netlify Identity (api.netlify.com/auth),
# lo que deja el spinner de login colgado indefinidamente.
# El flujo PKCE funciona nativamente sin ese bug.
#
# CONFIGURACIÓN PKCE EN DECAP CMS:
#   - auth_type: pkce
#   - app_id: Client ID de la GitHub OAuth App (público)
#   - No requiere Client Secret (es de conocimiento del navegador solo)
#
# FLUJO:
#   1. Decap CMS genera code_verifier + code_challenge (cripto, en sessionStorage)
#   2. Decap CMS abre popup a https://github.com/login/oauth/authorize
#      con client_id, redirect_uri=https://www.mistervet.co/admin/,
#      code_challenge, state
#   3. Usuario autoriza en GitHub
#   4. GitHub redirige el popup a https://www.mistervet.co/admin/?code=xxx&state=yyy
#   5. Decap CMS (que está cargado en /admin/) intercepta el code, lo intercambia
#      por un access_token usando code_verifier
#   6. Decap CMS usa el access_token para llamar a la API de GitHub
#   7. El popup se cierra solo y el panel carga
#
# IMPORTANTE:
#   - La callback URL registrada en la GitHub OAuth App debe ser:
#     https://www.mistervet.co/admin/
#   - No se necesita /callback.html ni Worker OAuth proxy.
# ============================================================

backend:
  name: github
  repo: Merkevarch/mistervet-landing
  branch: master
  auth_type: pkce
  # Client ID de la GitHub OAuth App (público, va en el navegador).
  # Lo encuentras en https://github.com/settings/developers → tu OAuth App.
  # Flujo PKCE NO requiere Client Secret.
  app_id: Ov23liiyJzmHVadIq5bb

# Carpeta pública donde se sirven los assets estáticos.
# Las imágenes que subas desde el editor se guardarán en /public/blog/
media_folder: "public/blog"
public_folder: "/blog"

# Configuración del sitio visible en el panel
site_url: https://www.mistervet.co
display_url: https://www.mistervet.co
logo_url: https://www.mistervet.co/favicon.svg

# Colecciones — una por cada "tipo" de contenido gestionable
collections:
  - name: "posts"
    label: "Artículos del Blog"
    label_singular: "Artículo"
    description: "Artículos publicados en el blog de MisterVet. Se guardan como archivos .md en src/posts/."
    folder: "src/posts"
    create: true
    delete: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{title}} ({{category}}) — {{date}}"
    summary_fields:
      - title
      - category
      - date
    sortable_fields:
      - title
      - date

    fields:
      - label: "Título"
        name: "title"
        widget: "string"
        hint: "Título principal del artículo. Se mostrará como H1 en la página."

      - label: "Fecha de publicación"
        name: "date"
        widget: "datetime"
        hint: "Fecha y hora de publicación. Afecta el orden del listado del blog."

      - label: "Categoría"
        name: "category"
        widget: "select"
        options:
          - { label: "Mascotas", value: "Mascotas" }
          - { label: "Ganadería", value: "Ganadería" }
          - { label: "General", value: "General" }
        hint: "Categoría principal del artículo. Determina el color de la etiqueta en el blog."

      - label: "Autor"
        name: "author"
        widget: "string"
        default: "MisterVet"
        hint: "Nombre del autor. Por defecto 'MisterVet'."

      - label: "Resumen (excerpt)"
        name: "excerpt"
        widget: "text"
        hint: "Resumen corto del artículo (1-3 frases). Se usa en el listado del blog y como meta description para SEO."

      - label: "Contenido"
        name: "body"
        widget: "markdown"
        hint: "Contenido completo del artículo en Markdown. NO incluyas un # H1 al inicio (el sistema lo añade automáticamente desde el título)."
        modes:
          - rich_text
          - raw

# ============================================================
# Decap CMS Configuration — Flujo PKCE (moderno, sin Worker)
# ============================================================
# Autenticación directa con GitHub usando el flujo OAuth PKCE
# (Proof Key for Code Exchange). Es el estándar moderno y no requiere
# el Cloudflare Worker OAuth proxy.
#
# Configuración:
#   1. Crear GitHub OAuth App con callback URL:
#      https://www.mistervet.co/callback.html
#   2. Reemplazar GITHUB_OAUTH_CLIENT_ID abajo con el Client ID de la app
# ============================================================

backend:
  name: github
  repo: Merkevarch/mistervet-landing
  branch: master
  # Flujo PKCE: estándar moderno, no requiere client_secret ni Worker proxy.
  # Decap CMS genera un code_verifier aleatorio y lo usa para intercambiar
  # el code por un access_token directamente con GitHub.
  auth_type: pkce
  # Client ID de la GitHub OAuth App (público, va en el navegador).
  # ⚠️ REEMPLAZAR con tu Client ID real (lo encuentras en
  # https://github.com/settings/developers → tu OAuth App)
  app_id: Ov23liiyJzmHVadIq5bb

# Carpeta pública donde se sirven los assets estáticos.
# Las imágenes que subas desde el editor se guardarán en /public/blog/
media_folder: "public/blog"
public_folder: "/blog"

# Configuración del sitio visible en el panel
site_url: https://www.mistervet.co
display_url: https://www.mistervet.co
logo_url: https://www.mistervet.co/favicon.svg

# Colecciones — una por cada "tipo" de contenido gestionable
collections:
  - name: "posts"
    label: "Artículos del Blog"
    label_singular: "Artículo"
    description: "Artículos publicados en el blog de MisterVet. Se guardan como archivos .md en src/posts/."
    folder: "src/posts"
    create: true
    delete: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{title}} ({{category}}) — {{date}}"
    summary_fields:
      - title
      - category
      - date
    sortable_fields:
      - title
      - date

    fields:
      - label: "Título"
        name: "title"
        widget: "string"
        hint: "Título principal del artículo. Se mostrará como H1 en la página."

      - label: "Fecha de publicación"
        name: "date"
        widget: "datetime"
        hint: "Fecha y hora de publicación. Afecta el orden del listado del blog."

      - label: "Categoría"
        name: "category"
        widget: "select"
        options:
          - { label: "Mascotas", value: "Mascotas" }
          - { label: "Ganadería", value: "Ganadería" }
          - { label: "General", value: "General" }
        hint: "Categoría principal del artículo. Determina el color de la etiqueta en el blog."

      - label: "Autor"
        name: "author"
        widget: "string"
        default: "MisterVet"
        hint: "Nombre del autor. Por defecto 'MisterVet'."

      - label: "Resumen (excerpt)"
        name: "excerpt"
        widget: "text"
        hint: "Resumen corto del artículo (1-3 frases). Se usa en el listado del blog y como meta description para SEO."

      - label: "Contenido"
        name: "body"
        widget: "markdown"
        hint: "Contenido completo del artículo en Markdown. NO incluyas un # H1 al inicio (el sistema lo añade automáticamente desde el título)."
        modes:
          - rich_text
          - raw

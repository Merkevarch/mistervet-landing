# ============================================================
# Decap CMS Configuration — Flujo implicit con Worker OAuth
# ============================================================
# Decap CMS con auth_type: implicit requiere:
#   - base_url: URL base del OAuth proxy (sin path)
#   - auth_endpoint: path del endpoint que inicia el flujo OAuth
#
# Decap CMS construye la URL así:
#   ${base_url}${auth_endpoint}?provider=github&scope=repo&site_id=...
#
# El Worker (en base_url) recibe la petición y responde con 302
# redirect a https://github.com/login/oauth/authorize?client_id=...
# ============================================================

backend:
  name: github
  repo: Merkevarch/mistervet-landing
  branch: master
  auth_type: implicit
  # URL del Cloudflare Worker OAuth proxy (sin slash final).
  # Decap CMS hará peticiones a ${base_url}${auth_endpoint}
  base_url: https://mistervet-cms-oauth.rubenfchavez.workers.dev
  # Path del endpoint que inicia el flujo OAuth en el Worker.
  # El Worker responde con 302 redirect a GitHub OAuth.
  auth_endpoint: /auth

# Carpeta pública donde se sirven los assets estáticos.
# Las imágenes que subas desde el editor se guardarán en /public/blog/
media_folder: "public/blog"
public_folder: "/blog"

# Configuración del sitio visible en el panel
site_url: https://www.mistervet.co
display_url: https://www.mistervet.co
logo_url: https://www.mistervet.co/favicon.svg

# Colecciones — una por cada "tipo" de contenido gestionable
collections:
  - name: "posts"
    label: "Artículos del Blog"
    label_singular: "Artículo"
    description: "Artículos publicados en el blog de MisterVet. Se guardan como archivos .md en src/posts/."
    folder: "src/posts"
    create: true
    delete: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{title}} ({{category}}) — {{date}}"
    summary_fields:
      - title
      - category
      - date
    sortable_fields:
      - title
      - date

    fields:
      - label: "Título"
        name: "title"
        widget: "string"
        hint: "Título principal del artículo. Se mostrará como H1 en la página."

      - label: "Fecha de publicación"
        name: "date"
        widget: "datetime"
        hint: "Fecha y hora de publicación. Afecta el orden del listado del blog."

      - label: "Categoría"
        name: "category"
        widget: "select"
        options:
          - { label: "Mascotas", value: "Mascotas" }
          - { label: "Ganadería", value: "Ganadería" }
          - { label: "General", value: "General" }
        hint: "Categoría principal del artículo. Determina el color de la etiqueta en el blog."

      - label: "Autor"
        name: "author"
        widget: "string"
        default: "MisterVet"
        hint: "Nombre del autor. Por defecto 'MisterVet'."

      - label: "Resumen (excerpt)"
        name: "excerpt"
        widget: "text"
        hint: "Resumen corto del artículo (1-3 frases). Se usa en el listado del blog y como meta description para SEO."

      - label: "Contenido"
        name: "body"
        widget: "markdown"
        hint: "Contenido completo del artículo en Markdown. NO incluyas un # H1 al inicio (el sistema lo añade automáticamente desde el título)."
        modes:
          - rich_text
          - raw
